plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.gon.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.gon.launcher'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        gon {
            storeFile file('gon.jks')
            storePassword 'gonlauncher'
            keyAlias 'gon'
            keyPassword 'gonlauncher'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.gon
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
